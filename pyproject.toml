[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ztna-ueba-field-attention"
version = "0.1.0"
description = "Schema-independent hierarchical field attention for ZTNA trust scoring"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2,<3",
  "pandas>=2,<4",
  "PyYAML>=6,<7",
  "scikit-learn>=1.7,<2",
  "torch>=2.13,<2.14",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
